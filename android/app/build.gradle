plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rsiprevention.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rsiprevention.app"
        // minSdk 31 é obrigatório: <uses-native-library> (necessária para o QNN
        // enxergar libcdsprpc.so em /vendor) só é suportado a partir do SDK 31.
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // Único ABI relevante: QNN HTP não existe em armeabi-v7a/x86/x86_64
            // no POCO F7 (Snapdragon 8s Gen 4 / Hexagon V73).
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // useLegacyPackaging=true: extrai os .so para um caminho real em
            // disco na instalação (em vez de carregar via mmap direto de
            // dentro do .apk). Necessário neste projeto porque o backend QNN
            // (libQnnHtp.so) falha ao inicializar seu próprio logging interno
            // quando carregado a partir de um caminho sintético dentro do
            // APK zip (`base.apk!/lib/arm64-v8a/...`) — erro real observado
            // no aparelho: "Initialization of logging failed in the QNN
            // backend" / QNN_BACKEND_ERROR_CANNOT_INITIALIZE. O SDK QNN é uma
            // lib de terceiros (Qualcomm) que espera resolver arquivos-irmãos
            // via caminho de arquivo normal, não um caminho dentro de zip.
            // Seguro neste aparelho: `getconf PAGE_SIZE` no POCO F7 confirma
            // kernel de 4KB (não 16KB), então a preocupação de alinhamento da
            // seção 9.2 do doc de deploy não se aplica a este device agora.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }

    androidResources {
        // Modelos ONNX/QNN não devem ser compactados no APK: precisam ser
        // lidos via mmap/FileDescriptor de forma eficiente pelo ONNX Runtime.
        // "data" cobre os pesos em external data (`*.onnx` + `*.data`) do
        // export `--runtime onnx` (ver ModelSessions.kt).
        noCompress += ["onnx", "bin", "data", "ort", "u8"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Runtime de inferência fixo deste projeto: ONNX Runtime + QNN Execution Provider.
    // Versão 1.29.0 (mais recente no Maven Central em agosto/2026): embarca QNN SDK
    // 2.42.0, que reconhece o Snapdragon 8s Gen 4 (SM8735) deste aparelho —
    // confirmado no device ("QnnDsp <V> Detected Snapdragon SOC SM8735"). A versão
    // antiga (1.20.0, QNN SDK 2.27) não reconhecia esse SoC e falhava com
    // "SoC model is unknown" / QNN_BACKEND_ERROR_CANNOT_INITIALIZE mesmo com
    // soc_model/htp_arch explícitos.
    // Nota de compatibilidade: o modelo é exportado com `--runtime onnx --quantize
    // w8a8` (grafo QDQ "portátil", compilado para HTP no próprio aparelho na criação
    // da sessão). Não há binário de contexto QNN pré-compilado, o que elimina o
    // acoplamento "versão do QAIRT usada no AI Hub × versão do QNN SDK do AAR" que
    // causava erro 5000 (context binary incompatível) na abordagem precompiled_qnn_onnx.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android-qnn:1.29.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
